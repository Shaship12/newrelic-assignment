name: Terraform Plan

on:
  # Manual trigger - pick the environment from the Actions UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan against"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - staging
          - prod

  # Automatic plan on PRs that touch infra or app code, always against dev.
  # Staging/prod plans are deliberately manual-only (see README).
  pull_request:
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write   # required to mint the OIDC token for AWS
  contents: read
  pull-requests: write   # required to comment the plan on the PR

env:
  TF_VERSION: "1.7.5"
  # PRs always plan dev; manual runs use whatever the user picked
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  terraform-plan:
    name: terraform plan (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    # GitHub Environments give us per-environment secrets and, for prod,
    # a required-reviewers approval gate configured in repo settings.
    environment: ${{ github.event.inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC - no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: gha-terraform-plan-${{ env.DEPLOY_ENV }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ env.DEPLOY_ENV }}.tfvars" \
            -no-color \
            -out=tfplan
        continue-on-error: true

      - name: Post plan output as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan - \`${{ env.DEPLOY_ENV }}\`
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by @${{ github.actor }}, action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
